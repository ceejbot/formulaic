name: release
permissions:
    contents: read

on:
    push:
        tags:
            - "v**[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:
        inputs:
            refname:
                type: string
                description: the refname to build a release from
                default: latest

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    GH_REPO: ${{ github.repository }}

jobs:
    preflight:
        permissions:
            contents: write
        name: preflight
        runs-on: ubuntu-latest
        steps:
            - name: create github release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUTS_REF_NAME: ${{ inputs.refname }}
              run: |
                  REF_NAME="${GITHUB_REF_NAME}"
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                      REF_NAME="${INPUTS_REF_NAME}"
                  fi
                  gh release create "${REF_NAME}" --generate-notes

    release-linux:
        name: release-linux
        runs-on: ubuntu-latest
        needs: preflight
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                persist-credentials: false

            - name: get stable Rust
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
              with:
                  toolchain: stable
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target
                  cache: false

            - name: build for release and upload
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUTS_REF_NAME: ${{ inputs.refname }}
              run: |
                  REF_NAME="${GITHUB_REF_NAME}"
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                      REF_NAME="${INPUTS_REF_NAME}"
                  fi
                  cargo build --release
                  TARBALL=formulaic-x86_64-unknown-linux-gnu.tar.gz
                  tar czf "$TARBALL" --strip-components=2  target/release/formulaic
                  gh release upload "$REF_NAME" "$TARBALL"

                  digest=$(shasum -a 256 "$TARBALL")
                  shasum=$(echo "$digest" | { read -r first rest; echo "$first"; } )
                  echo "$shasum" > "$TARBALL".sha256
                  gh release upload "$REF_NAME" "$TARBALL".sha256

    release-macos:
        name: release-macos
        runs-on: macos-latest
        needs: preflight
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                persist-credentials: false

            - name: get stable Rust
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
              with:
                  toolchain: stable
                  target: aarch64-apple-darwin, x86_64-apple-darwin
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target
                  cache: false

            - name: build for release
              run: |
                  cargo build --release --target aarch64-apple-darwin
                  cargo build --release --target x86_64-apple-darwin

            - name: upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUTS_REF_NAME: ${{ inputs.refname }}
              run: |
                  REF_NAME="${GITHUB_REF_NAME}"
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                      REF_NAME="${INPUTS_REF_NAME}"
                  fi
                  mkdir -p dist
                  cd dist
                  for target in "aarch64-apple-darwin" "x86_64-apple-darwin"; do
                      TARBALL="formulaic-$target.tar.gz"
                      tar czf "$TARBALL" --strip-components=4  ../target/$target/release/formulaic
                      gh release upload "${REF_NAME}" "$TARBALL"

                      digest=$(shasum -a 256 "$TARBALL")
                      shasum=$(echo "$digest" | { read -r first rest; echo "$first"; } )
                      echo "$shasum" > "$TARBALL".sha256
                      gh release upload "${REF_NAME}" "$TARBALL".sha256
                  done

    postflight:
        permissions:
            contents: write
        name: postflight
        runs-on: ubuntu-latest
        needs:
            - release-linux
            - release-macos
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                persist-credentials: false

            - name: get stable Rust
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
              with:
                  toolchain: stable
                  cache: false

            - name: generate a formula file for all assets
              env:
                  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: formula_file=$(cargo run --release --quiet -- ./Cargo.toml)

            - name: update the homebrew tap
              env:
                  GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              shell: bash
              run: |
                  gh repo clone ceejbot/homebrew-tap
                  cd homebrew-tap || exit 1
                  cp ../formulaic.rb Formula/
                  git add Formula/formulaic.rb
                  git config user.name "formula robot"
                  git config user.email "ceejceej@gmail.com"
                  git commit -m "formulaic ${GITHUB_REF_NAME}"
                  git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/ceejbot/homebrew-tap.git
